<!doctype html><html lang="da"><head><base target="_top"><meta name="viewport" content="width=device-width,initial-scale=1"><style> *{box-sizing:border-box}body{margin:0;background:#f5f3ee;color:#092a3d;font:17px/1.5 system-ui}header{background:#092a3d;color:white;padding:20px;text-align:center;font-weight:700}main{max-width:560px;margin:24px auto;padding:24px;background:white;border-radius:16px}label{display:block;margin:16px 0 4px;font-weight:600}input,button{font:inherit;width:100%;padding:12px;border:1px solid #9daeb7;border-radius:8px}button{background:#092a3d;color:white;margin-top:20px;cursor:pointer}button:disabled{opacity:.5}a{color:#14536d}small{display:block;margin-top:20px} [hidden]{display:none!important}</style></head><body><header>Ebeltoft Marineforening</header><main id="context" data-event="<?= eventId ?>" data-token="<?= token ?>"><h1 id="title">Tilmelding</h1><p id="status" role="status">Henter arrangement…</p><form id="form" hidden><label for="name">Navn</label><input id="name" required maxlength="100" autocomplete="name"><label for="email">E-mail</label><input id="email" type="email" required maxlength="254" autocomplete="email"><label for="count">Antal deltagere</label><input id="count" type="number" min="1" max="20" value="1" required><small>Oplysningerne bruges til administration af arrangementet og nødvendige e-mails. Kontakt marineforeningen-ebeltoft@mail.dk om dine oplysninger.</small><button id="send">Send tilmelding</button></form><button id="cancel" hidden>Bekræft afmelding</button><p><a href="https://marineforening-ebeltoft.github.io/hjemmeside/#arrangementer">Tilbage til hjemmesiden</a></p></main><script>const {event:eventId,token}=document.getElementById("context").dataset;const $=id=>document.getElementById(id);function fail(e){$('status').textContent=e.message||'Der opstod en fejl. Prøv igen eller kontakt foreningen.';$('send').disabled=false;$('cancel').disabled=false}if(token){$('title').textContent='Afmelding';google.script.run.withFailureHandler(fail).withSuccessHandler(r=>{$('status').textContent=r.ok?r.title+' · '+r.date+' · '+r.count+' deltagere':'Linket er ugyldigt, eller tilmeldingen er allerede afmeldt.';$('cancel').hidden=!r.ok}).cancelInfo(token);$('cancel').onclick=()=>{$('cancel').disabled=true;google.script.run.withFailureHandler(fail).withSuccessHandler(r=>{$('status').textContent=r.ok?'Din afmelding er registreret.':'Afmelding kunne ikke gennemføres.';$('cancel').hidden=true}).cancelRegistration(token)}}else{google.script.run.withFailureHandler(fail).withSuccessHandler(r=>{if(!r.open){$('status').textContent='Online tilmelding er ikke åben. Kontakt foreningen.';return}$('title').textContent=r.title;$('status').textContent=r.date+' · '+r.time+' · '+r.place+' · Frist: '+r.deadline+(r.left===null?'':' · Ledige pladser: '+r.left);$('form').hidden=r.left===0;if(r.left!==null)$('count').max=Math.min(20,r.left)}).publicEvent(eventId);$('form').onsubmit=e=>{e.preventDefault();$('send').disabled=true;google.script.run.withFailureHandler(fail).withSuccessHandler(r=>{$('status').textContent=r.message;if(r.ok)$('form').hidden=true;else $('send').disabled=false}).register({id:eventId,name:$('name').value,email:$('email').value,count:$('count').value})}}</script></body></html>
